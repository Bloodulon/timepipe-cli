[package]
name = "timepipe"
version = "0.1.0"
edition = "2021"
description = "TUI time tracker"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rust_xlsxwriter = "0.79"
zip = "2"
ureq = { version = "2.9", features = ["json"] }
tiny_http = "0.12"
webbrowser = "0.8"
